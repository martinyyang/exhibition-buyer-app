name: Pre-Release Validation

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Create .env file
      run: |
        echo "Creating .env file..."
        cat > .env << 'EOF'
        SUPABASE_URL=${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        EOF

        if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
          echo "❌ ERROR: SUPABASE_URL secret is not configured!"
          exit 1
        fi

        if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
          echo "❌ ERROR: SUPABASE_ANON_KEY secret is not configured!"
          exit 1
        fi

        echo "✓ Secrets validated successfully"

    - name: Get dependencies
      run: flutter pub get

    - name: Setup Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        profile: pixel_4
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        disable-animations: true
        script: |
          echo "Emulator started, waiting for boot..."
          adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          echo "Emulator ready"

    - name: Run Smoke Test
      run: |
        chmod +x scripts/smoke_test.sh
        ./scripts/smoke_test.sh
      timeout-minutes: 20

    - name: Upload APK on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failed-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload test logs on failure
      if: failure()
      run: |
        adb logcat -d > smoke_test_failure.log

    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-logs
        path: smoke_test_failure.log

  build-and-release:
    needs: smoke-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        cache: true

    - name: Create .env file
      run: |
        cat > .env << 'EOF'
        SUPABASE_URL=${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        EOF

    - name: Get dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release

    - name: Get version from pubspec
      id: version
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Rename APK with version
      run: |
        cp build/app/outputs/flutter-apk/app-release.apk exhibition-buyer-app-v${{ steps.version.outputs.version }}.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: exhibition-buyer-app-v${{ steps.version.outputs.version }}.apk
        body: |
          ## 展会买手协同管理系统 v${{ steps.version.outputs.version }}

          **发布时间:** ${{ github.event.head_commit.timestamp }}
          **提交 SHA:** `${{ github.sha }}`

          ### ✅ 冒烟测试已通过
          - 应用启动无崩溃
          - 应用运行无卡顿
          - 环境配置加载正常
          - 网络请求功能正常

          ### 📦 安装方式
          1. 下载下方的 APK 文件
          2. 传输到Android手机
          3. 允许安装未知来源应用
          4. 点击APK文件安装

          ### 📱 直接下载链接
          [点击下载 v${{ steps.version.outputs.version }} APK](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/exhibition-buyer-app-v${{ steps.version.outputs.version }}.apk)

          ### 🐛 问题反馈
          如遇到问题，请在 [Issues](https://github.com/${{ github.repository }}/issues) 提交反馈
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
