<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>生产环境初始化测试</title>
</head>
<body>
    <h1>测试编译时环境变量</h1>
    <pre id="output"></pre>

    <script>
        const output = document.getElementById('output');

        // 模拟 Flutter 的 String.fromEnvironment 行为
        // Cloudflare Pages 应该在构建时通过 --dart-define 注入这些值

        output.textContent = `
这个测试模拟 Flutter main.dart 中的环境变量检测逻辑：

const webSupabaseUrl = String.fromEnvironment('SUPABASE_URL');
const webSupabaseAnonKey = String.fromEnvironment('SUPABASE_ANON_KEY');
const webSupabaseProxyUrl = String.fromEnvironment('SUPABASE_PROXY_URL');

if (webSupabaseUrl.isNotEmpty && webSupabaseAnonKey.isNotEmpty) {
    // 使用编译时环境变量
    print('✓ Using compile-time environment variables');
} else {
    // 尝试加载 .env 文件（会失败，因为生产环境没有 .env）
    await dotenv.load(fileName: '.env');
}

问题：
1. Cloudflare Pages 构建命令必须包含：
   flutter build web --dart-define=SUPABASE_URL=$SUPABASE_URL

2. Cloudflare Pages 环境变量必须配置：
   Settings → Environment variables → Production
   - SUPABASE_URL
   - SUPABASE_ANON_KEY
   - SUPABASE_PROXY_URL (可选)

如果缺少任何一步，Flutter 会走到 dotenv.load() 分支，
但生产环境没有 .env 文件，就会抛出异常 "应用初始化失败"。

请检查 Cloudflare Pages Dashboard:
https://dash.cloudflare.com/
→ Workers & Pages → exhibition-buyer-app
→ Settings → Environment variables
`;
    </script>
</body>
</html>
